
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMONG US CREW ATTENDANCE</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;color:white;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#243b62,#080d19 70%);min-height:100vh}
.container{max-width:650px;margin:auto}
header{text-align:center;padding:15px}
h1{color:#ff4655;font-size:25px}
header p{color:#a9badc}
.panel{background:#17243c;border:1px solid #405477;border-radius:15px;padding:17px;margin:15px 0;box-shadow:0 7px 22px #0007}
h2{color:#ff6470;font-size:19px}
input,select,button{width:100%;padding:12px;margin:6px 0;border:1px solid #647a9e;border-radius:8px;font-size:15px}
button{background:#e94352;color:white;border:0;font-weight:bold}
button.secondary{background:#405477}
button.danger{background:#7e3441}
button:disabled{opacity:.5}
.hidden{display:none!important}
.item{background:#263958;padding:12px;margin:9px 0;border-radius:9px;overflow-wrap:anywhere}
.actions{display:flex;gap:8px}
.actions button{flex:1}
.stat{padding:8px 0;border-bottom:1px solid #405477}
#message{color:#ffd66b;text-align:center;min-height:25px}
.small{font-size:12px;color:#a9badc}
.tabs{display:flex;gap:7px;flex-wrap:wrap}
.tabs button{flex:1;min-width:100px}
.rank{display:flex;justify-content:space-between;gap:10px;align-items:center}
.rank strong{color:#ffd66b}
</style>
</head>
<body>
<div class="container">

<header>
<h1>🚀 AMONG US</h1>
<p>CREW ATTENDANCE SYSTEM</p>
</header>

<div class="panel">
<h2>🧑‍🚀 CREW CHECK-IN</h2>
<select id="member">
<option value="">メンバーを読み込み中...</option>
</select>
<button id="apply">出席を申請する</button>
</div>

<div class="panel">
<h2>🌟 CREW PUBLIC DATA</h2>
<div class="tabs">
<button id="showRanking" class="secondary">🏆 ランキング</button>
<button id="showHistory" class="secondary">📋 出席履歴</button>
</div>
<div id="publicData">読み込み中...</div>
</div>

<div class="panel">
<h2>🔐 ADMIN LOGIN</h2>
<input id="email" type="email" placeholder="管理者メールアドレス">
<input id="password" type="password" placeholder="パスワード">
<button id="login">ログイン</button>
<button id="logout" class="secondary hidden">ログアウト</button>
<p id="adminStatus">ログインしていません</p>
</div>

<div id="adminPanel" class="hidden">

<div class="panel">
<h2>📋 出席申請管理</h2>
<button id="refresh" class="secondary">申請一覧を更新</button>
<div id="requests">読み込み待ち</div>
</div>

<div class="panel">
<h2>👥 メンバー管理</h2>
<input id="newMember" placeholder="新しいメンバー名">
<button id="addMember">メンバーを追加</button>
<div id="membersAdmin"></div>
</div>

<div class="panel">
<h2>🏆 出席率ランキング設定</h2>
<p class="small">この日から出席率の集計を開始します。</p>
<input type="date" id="rankingStart">
<button id="saveRankingStart">集計開始日を保存</button>
</div>

<div class="panel">
<h2>📅 休日管理</h2>
<input type="date" id="holidayDate">
<input id="holidayName" placeholder="休日の名前">
<button id="addHoliday">休日を登録</button>
<div id="holidays"></div>
</div>

<div class="panel">
<h2>📝 テスト期間管理</h2>
<label>開始日</label>
<input type="date" id="testStart">
<label>終了日</label>
<input type="date" id="testEnd">
<input id="testName" placeholder="テスト期間の名前">
<button id="addTest">テスト期間を登録</button>
<div id="tests"></div>
</div>

</div>

<p id="message"></p>
</div>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

import {
 getAuth,signInAnonymously,signInWithEmailAndPassword,
 signOut,onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

import {
 getFirestore,collection,getDocs,addDoc,setDoc,
 serverTimestamp,doc,updateDoc,deleteDoc,query,
 orderBy,getDoc
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyDNzOhy5a5Q9xvX_khXCrQIgkgFBn9TyvE",
 authDomain:"amongus-crew-attendance.firebaseapp.com",
 projectId:"amongus-crew-attendance",
 storageBucket:"amongus-crew-attendance.firebasestorage.app",
 messagingSenderId:"560094086894",
 appId:"1:560094086894:web:683d51d9b3648054d5d5ff",
 measurementId:"G-W3HF87PBPX"
};

const ADMIN_UID="nPCMPMkbHyetAGOd0SS9GZKRZRo2";
const DEFAULT_START_DATE="2026-11-27";

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const $=id=>document.getElementById(id);

let admin=false;
let memberCache=[];
let requestCache=[];
let publicCache=[];
let holidayCache=[];
let testCache=[];
let rankingStartDate=DEFAULT_START_DATE;
let publicMode="ranking";

function msg(t){$("message").textContent=t}

function today(){
 const d=new Date();
 return d.getFullYear()+"-"+
 String(d.getMonth()+1).padStart(2,"0")+"-"+
 String(d.getDate()).padStart(2,"0");
}

function dateText(timestamp){
 if(!timestamp)return "日付不明";
 return timestamp.toDate().toLocaleDateString("ja-JP");
}

/* メンバー */
async function loadMembers(){
 const snap=await getDocs(collection(db,"members"));
 memberCache=[];
 const select=$("member");
 const oldValue=select.value;
 select.innerHTML='<option value="">メンバーを選択</option>';

 snap.forEach(d=>{
  const x={id:d.id,...d.data()};
  memberCache.push(x);
  const o=document.createElement("option");
  o.value=d.id;
  o.textContent=x.name;
  select.appendChild(o);
 });

 if(memberCache.some(m=>m.id===oldValue))select.value=oldValue;
 if(admin)renderMembers();
}

/* 公開用データ */
async function loadPublicData(){
 const results=await Promise.all([
  getDocs(collection(db,"public_attendance")),
  getDocs(collection(db,"holidays")),
  getDocs(collection(db,"test_periods")),
  getDoc(doc(db,"settings","attendance"))
 ]);

 publicCache=[];
 results[0].forEach(d=>publicCache.push({id:d.id,...d.data()}));

 holidayCache=[];
 results[1].forEach(d=>holidayCache.push({id:d.id,...d.data()}));

 testCache=[];
 results[2].forEach(d=>testCache.push({id:d.id,...d.data()}));

 rankingStartDate=results[3].exists()
  ?results[3].data().startDate||DEFAULT_START_DATE
  :DEFAULT_START_DATE;

 renderPublicData();
}

/* 管理者の承認済み記録を公開用コレクションへ同期 */
async function syncPublicAttendance(){
 for(const r of requestCache){
  const ref=doc(db,"public_attendance",r.id);

  if(r.status==="approved"){
   await setDoc(ref,{
    memberId:r.memberId||"",
    name:r.name||"名前不明",
    attendanceDate:r.attendanceDate||"",
    status:"approved",
    createdAt:r.createdAt||serverTimestamp()
   });
  }else{
   await deleteDoc(ref).catch(()=>{});
  }
 }
}

function isExcluded(date){
 if(holidayCache.some(x=>x.date===date))return true;
 return testCache.some(x=>date>=x.start&&date<=x.end);
}

function getEligibleDates(){
 const dates=[];
 const begin=new Date(rankingStartDate+"T12:00:00");
 const end=new Date(today()+"T12:00:00");

 if(begin>end)return dates;

 for(let d=new Date(begin);d<=end;d.setDate(d.getDate()+1)){
  const key=d.getFullYear()+"-"+
   String(d.getMonth()+1).padStart(2,"0")+"-"+
   String(d.getDate()).padStart(2,"0");
  if(!isExcluded(key))dates.push(key);
 }
 return dates;
}

function renderPublicData(){
 const area=$("publicData");
 area.innerHTML="";

 if(publicMode==="ranking"){
  const dates=getEligibleDates();
  const ranking=memberCache.map(m=>{
   const attended=new Set(
    publicCache
     .filter(r=>r.memberId===m.id&&r.status==="approved")
     .map(r=>r.attendanceDate)
     .filter(d=>d&&dates.includes(d))
   );
   return {
    name:m.name,
    count:attended.size,
    rate:dates.length?attended.size/dates.length*100:0
   };
  });

  ranking.sort((a,b)=>b.rate-a.rate||b.count-a.count);

  const summary=document.createElement("div");
  summary.className="stat";
  summary.textContent="集計対象日数："+dates.length+"日";
  area.append(summary);

  if(!ranking.length){
   area.textContent="メンバーがまだ登録されていません";
  }

  ranking.forEach((x,i)=>{
   const item=document.createElement("div");
   item.className="item rank";

   const name=document.createElement("strong");
   name.textContent=(i+1)+"位 "+x.name;

   const score=document.createElement("span");
   score.textContent=x.count+"日 / "+x.rate.toFixed(1)+"%";

   item.append(name,score);
   area.append(item);
  });
 }else{
  const records=[...publicCache]
   .filter(r=>r.status==="approved"&&r.attendanceDate)
   .sort((a,b)=>b.attendanceDate.localeCompare(a.attendanceDate));

  if(!records.length){
   area.textContent="承認済みの出席履歴はありません";
   return;
  }

  records.forEach(r=>{
   const item=document.createElement("div");
   item.className="item";

   const name=document.createElement("strong");
   name.textContent=r.name||"名前不明";

   const date=document.createElement("p");
   date.textContent="出席日："+r.attendanceDate;

   const status=document.createElement("span");
   status.textContent="承認済み ✓";

   item.append(name,date,status);
   area.append(item);
  });
 }
}

$("showRanking").onclick=()=>{
 publicMode="ranking";
 renderPublicData();
};
$("showHistory").onclick=()=>{
 publicMode="history";
 renderPublicData();
};

/* 出席申請 */
$("apply").onclick=async()=>{
 const id=$("member").value;
 const name=$("member").selectedOptions[0]?.textContent;

 if(!id){
  msg("メンバーを選択してください");
  return;
 }

 $("apply").disabled=true;
 msg("申請しています...");

 try{
  const requestId=id+"_"+today();

  await setDoc(doc(db,"attendance_requests",requestId),{
   memberId:id,
   name,
   uid:auth.currentUser.uid,
   status:"pending",
   attendanceDate:today(),
   createdAt:serverTimestamp()
  });

  msg("出席申請できました！");
 }catch(e){
  if(e.code==="permission-denied"){
   msg("今日はすでに申請済みか、申請できません。");
  }else{
   msg("申請エラー："+e.message);
  }
 }finally{
  $("apply").disabled=false;
 }
};

/* ログイン */
$("login").onclick=async()=>{
 try{
  const result=await signInWithEmailAndPassword(
   auth,$("email").value,$("password").value
  );

  if(result.user.uid!==ADMIN_UID){
   await signOut(auth);
   msg("管理者アカウントではありません");
   return;
  }

  msg("管理者ログイン成功！");
 }catch(e){
  msg("ログイン失敗："+e.message);
 }
};

function showAdmin(){
 $("adminPanel").classList.toggle("hidden",!admin);
 $("logout").classList.toggle("hidden",!admin);
 $("login").classList.toggle("hidden",admin);
 $("email").classList.toggle("hidden",admin);
 $("password").classList.toggle("hidden",admin);
 $("adminStatus").textContent=admin?"管理者ログイン中":"ログインしていません";
}

$("logout").onclick=async()=>{
 await signOut(auth);
 admin=false;
 showAdmin();
 msg("ログアウトしました");
};

/* 申請一覧 */
async function loadRequests(){
 const area=$("requests");
 area.textContent="読み込み中...";

 const snap=await getDocs(query(
  collection(db,"attendance_requests"),
  orderBy("createdAt","desc")
 ));

 requestCache=[];
 snap.forEach(d=>requestCache.push({id:d.id,...d.data()}));
 area.innerHTML="";

 if(!requestCache.length){
  area.textContent="申請はありません";
  return;
 }

 requestCache.forEach(x=>{
  const item=document.createElement("div");
  item.className="item";

  const title=document.createElement("strong");
  title.textContent=x.name||"名前不明";

  const info=document.createElement("p");
  info.textContent="状態："+(x.status||"不明")+" / 日付："+(x.attendanceDate||dateText(x.createdAt));

  item.append(title,info);

  if(x.status==="pending"){
   const actions=document.createElement("div");
   actions.className="actions";

   const a=document.createElement("button");
   a.textContent="承認";
   a.onclick=()=>changeStatus(x.id,"approved");

   const r=document.createElement("button");
   r.textContent="却下";
   r.className="secondary";
   r.onclick=()=>changeStatus(x.id,"rejected");

   actions.append(a,r);
   item.append(actions);
  }

  area.append(item);
 });
}

async function changeStatus(id,status){
 try{
  await updateDoc(doc(db,"attendance_requests",id),{status});

  const original=requestCache.find(r=>r.id===id);
  if(original){
   const publicRef=doc(db,"public_attendance",id);
   if(status==="approved"){
    await setDoc(publicRef,{
     memberId:original.memberId||"",
     name:original.name||"名前不明",
     attendanceDate:original.attendanceDate||"",
     status:"approved",
     createdAt:original.createdAt||serverTimestamp()
    });
   }else{
    await deleteDoc(publicRef).catch(()=>{});
   }
  }

  msg(status==="approved"?"承認しました":"却下しました");
  await refreshAll();
 }catch(e){
  msg("更新できません："+e.message);
 }
}

/* メンバー管理 */
async function renderMembers(){
 const area=$("membersAdmin");
 area.innerHTML="";

 memberCache.forEach(x=>{
  const item=document.createElement("div");
  item.className="item";

  const name=document.createElement("span");
  name.textContent=x.name;

  const del=document.createElement("button");
  del.className="danger";
  del.textContent="削除";

  del.onclick=async()=>{
   if(!confirm(x.name+"を削除しますか？"))return;
   try{
    await deleteDoc(doc(db,"members",x.id));
    msg("メンバーを削除しました");
    await refreshAll();
   }catch(e){
    msg("削除できません："+e.message);
   }
  };

  item.append(name,del);
  area.append(item);
 });
}

$("addMember").onclick=async()=>{
 const name=$("newMember").value.trim();
 if(!name){
  msg("名前を入力してください");
  return;
 }

 try{
  await addDoc(collection(db,"members"),{name});
  $("newMember").value="";
  msg("メンバーを追加しました");
  await refreshAll();
 }catch(e){
  msg("追加できません："+e.message);
 }
};

/* 休日 */
async function loadHolidays(){
 const area=$("holidays");
 area.innerHTML="";

 holidayCache.forEach(x=>{
  const item=document.createElement("div");
  item.className="item";

  const text=document.createElement("span");
  text.textContent=(x.date||"")+" "+(x.name||"休日");

  const del=document.createElement("button");
  del.className="danger";
  del.textContent="削除";
  del.onclick=()=>removeRecord("holidays",x.id);

  item.append(text,del);
  area.append(item);
 });
}

$("addHoliday").onclick=async()=>{
 const date=$("holidayDate").value;
 if(!date){msg("日付を選択してください");return;}

 try{
  await addDoc(collection(db,"holidays"),{
   date,
   name:$("holidayName").value.trim()||"休日",
   createdAt:serverTimestamp()
  });
  $("holidayName").value="";
  msg("休日を登録しました");
  await refreshAll();
 }catch(e){msg("休日を登録できません："+e.message);}
};

/* テスト期間 */
async function loadTests(){
 const area=$("tests");
 area.innerHTML="";

 testCache.forEach(x=>{
  const item=document.createElement("div");
  item.className="item";

  const text=document.createElement("span");
  text.textContent=(x.name||"テスト期間")+"："+x.start+" ～ "+x.end;

  const del=document.createElement("button");
  del.className="danger";
  del.textContent="削除";
  del.onclick=()=>removeRecord("test_periods",x.id);

  item.append(text,del);
  area.append(item);
 });
}

$("addTest").onclick=async()=>{
 const start=$("testStart").value;
 const end=$("testEnd").value;

 if(!start||!end||start>end){
  msg("開始日と終了日を正しく選んでください");
  return;
 }

 try{
  await addDoc(collection(db,"test_periods"),{
   start,end,
   name:$("testName").value.trim()||"テスト期間",
   createdAt:serverTimestamp()
  });
  $("testName").value="";
  msg("テスト期間を登録しました");
  await refreshAll();
 }catch(e){msg("テスト期間を登録できません："+e.message);}
};

async function removeRecord(col,id){
 try{
  await deleteDoc(doc(db,col,id));
  msg("削除しました");
  await refreshAll();
 }catch(e){msg("削除できません："+e.message);}
}

/* 集計開始日 */
$("saveRankingStart").onclick=async()=>{
 const date=$("rankingStart").value;
 if(!date){msg("集計開始日を選択してください");return;}
 if(date>today()){msg("未来の日付は設定できません");return;}

 try{
  await setDoc(doc(db,"settings","attendance"),{startDate:date});
  rankingStartDate=date;
  renderPublicData();
  msg("集計開始日を保存しました！");
 }catch(e){msg("保存できません："+e.message);}
};

/* 管理者データ更新 */
async function refreshAll(){
 if(!admin)return;

 try{
  await loadMembers();
  const snap=await getDocs(query(
   collection(db,"attendance_requests"),
   orderBy("createdAt","desc")
  ));

  requestCache=[];
  snap.forEach(d=>requestCache.push({id:d.id,...d.data()}));

  await syncPublicAttendance();
  await loadPublicData();
  await loadRequests();
  await loadHolidays();
  await loadTests();

  $("rankingStart").value=rankingStartDate;
 }catch(e){
  msg("データ取得エラー："+e.message);
 }
}

$("refresh").onclick=refreshAll;

/* 認証状態に合わせて画面を準備 */
onAuthStateChanged(auth,async user=>{
 if(!user){
  try{await signInAnonymously(auth);}
  catch(e){msg("ログインできません："+e.message);}
  return;
 }

 if(user.uid===ADMIN_UID){
  admin=true;
  showAdmin();
  await refreshAll();
 }else{
  admin=false;
  showAdmin();
  try{
   await loadMembers();
   await loadPublicData();
  }catch(e){
   msg("データを読み込めません："+e.message);
  }
 }
});
</script>
</body>
</html>
