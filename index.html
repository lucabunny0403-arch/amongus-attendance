
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Among Us Crew Attendance</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;
 background:radial-gradient(circle at top,#263b63,#080d1c 65%);
 color:white;font-family:Arial,sans-serif;
 min-height:100vh
}
.container{max-width:520px;margin:auto}
h1{text-align:center;color:#ff4655;font-size:25px}
.subtitle{text-align:center;color:#b9c8e8}
.panel{
 background:#17233b;border:1px solid #405477;
 border-radius:15px;padding:18px;margin:18px 0;
 box-shadow:0 8px 25px #0008
}
h2{font-size:19px;color:#ff5967}
input,select,button{
 width:100%;padding:13px;margin:7px 0;
 border-radius:9px;border:1px solid #657b9f;
 font-size:16px
}
button{background:#e94352;color:white;border:0;font-weight:bold}
button.secondary{background:#405477}
button:disabled{opacity:.5}
.item{
 background:#263958;padding:12px;border-radius:9px;
 margin:9px 0;overflow-wrap:anywhere
}
.actions{display:flex;gap:8px}
.actions button{flex:1}
#message{color:#ffd66b;text-align:center;min-height:24px}
.hidden{display:none}
</style>
</head>
<body>
<div class="container">
<h1>🚀 CREW ATTENDANCE</h1>
<p class="subtitle">AMONG US CREW CHECK-IN SYSTEM</p>

<div class="panel">
<h2>🧑‍🚀 出席申請</h2>
<select id="member">
<option value="">メンバーを読み込み中...</option>
</select>
<button id="apply">出席を申請する</button>
</div>

<div class="panel">
<h2>🔐 管理者ログイン</h2>
<input id="email" type="email" placeholder="管理者メールアドレス">
<input id="password" type="password" placeholder="パスワード">
<button id="login">ログイン</button>
<button id="logout" class="secondary hidden">ログアウト</button>
<p id="adminStatus">ログインしていません</p>
</div>

<div id="adminPanel" class="panel hidden">
<h2>📋 出席申請一覧</h2>
<button id="refresh" class="secondary">一覧を更新</button>
<div id="requests">読み込み待ち</div>
</div>

<p id="message"></p>
</div>

<script type="module">
import {initializeApp} from
"https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
import {
 getAuth,signInAnonymously,signInWithEmailAndPassword,
 signOut,onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
import {
 getFirestore,collection,getDocs,addDoc,serverTimestamp,
 doc,updateDoc,query,orderBy
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyDNzOhy5a5Q9xvX_khXCrQIgkgFBn9TyvE",
 authDomain:"amongus-crew-attendance.firebaseapp.com",
 projectId:"amongus-crew-attendance",
 storageBucket:"amongus-crew-attendance.firebasestorage.app",
 messagingSenderId:"560094086894",
 appId:"1:560094086894:web:683d51d9b3648054d5d5ff",
 measurementId:"G-W3HF87PBPX"
};

const ADMIN_UID="nPCMPMkbHyetAGOd0SS9GZKRZRo2";

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const $=id=>document.getElementById(id);
let admin=false;

function message(text){$("message").textContent=text;}

async function loadMembers(){
 const select=$("member");
 try{
  const snap=await getDocs(collection(db,"members"));
  select.innerHTML='<option value="">メンバーを選択</option>';
  snap.forEach(d=>{
   const data=d.data();
   const option=document.createElement("option");
   option.value=d.id;
   option.textContent=data.name;
   select.appendChild(option);
  });
 }catch(e){
  message("メンバー一覧を読み込めません："+e.message);
 }
}

async function start(){
 try{
  await signInAnonymously(auth);
  await loadMembers();
 }catch(e){
  message("接続エラー："+e.message);
 }
}

$("apply").onclick=async()=>{
 const id=$("member").value;
 const name=$("member").selectedOptions[0]?.textContent;
 if(!id){message("メンバーを選択してください");return;}
 $("apply").disabled=true;
 message("お待ちください...");
 try{
  await addDoc(collection(db,"attendance_requests"),{
   memberId:id,name:name,uid:auth.currentUser.uid,
   status:"pending",createdAt:serverTimestamp()
  });
  message("申請できました！");
 }catch(e){
  message("申請できませんでした："+e.message);
 }finally{
  $("apply").disabled=false;
 }
};

$("login").onclick=async()=>{
 try{
  const result=await signInWithEmailAndPassword(
   auth,$("email").value,$("password").value
  );
  if(result.user.uid!==ADMIN_UID){
   await signOut(auth);
   message("管理者アカウントではありません");
   return;
  }
  admin=true;
  showAdmin();
  await loadRequests();
  message("管理者ログイン成功！");
 }catch(e){
  message("ログインできません："+e.message);
 }
};

function showAdmin(){
 $("adminPanel").classList.toggle("hidden",!admin);
 $("logout").classList.toggle("hidden",!admin);
 $("login").classList.toggle("hidden",admin);
 $("email").classList.toggle("hidden",admin);
 $("password").classList.toggle("hidden",admin);
 $("adminStatus").textContent=admin?"管理者ログイン中":"ログインしていません";
}

$("logout").onclick=async()=>{
 await signOut(auth);
 admin=false;
 showAdmin();
 message("ログアウトしました");
 await start();
};

$("refresh").onclick=loadRequests;

async function loadRequests(){
 if(!admin)return;
 const area=$("requests");
 area.textContent="読み込み中...";
 try{
  const snap=await getDocs(query(
   collection(db,"attendance_requests"),
   orderBy("createdAt","desc")
  ));
  area.innerHTML="";
  if(snap.empty){
   area.textContent="申請はありません";
   return;
  }
  snap.forEach(d=>{
   const data=d.data();
   const item=document.createElement("div");
   item.className="item";
   const title=document.createElement("strong");
   title.textContent=data.name||"名前不明";
   const status=document.createElement("p");
   status.textContent="状態："+(data.status||"未設定");
   item.append(title,status);
   if(data.status==="pending"){
    const actions=document.createElement("div");
    actions.className="actions";
    const approve=document.createElement("button");
    approve.textContent="承認";
    approve.onclick=()=>changeStatus(d.id,"approved");
    const reject=document.createElement("button");
    reject.textContent="却下";
    reject.className="secondary";
    reject.onclick=()=>changeStatus(d.id,"rejected");
    actions.append(approve,reject);
    item.append(actions);
   }
   area.append(item);
  });
 }catch(e){
  area.textContent="一覧を取得できません："+e.message;
 }
}

async function changeStatus(id,status){
 try{
  await updateDoc(doc(db,"attendance_requests",id),{status});
  message(status==="approved"?"承認しました":"却下しました");
  await loadRequests();
 }catch(e){
  message("更新できません："+e.message);
 }
}

onAuthStateChanged(auth,user=>{
 if(user && user.uid===ADMIN_UID){
  admin=true;
  showAdmin();
 }else if(admin){
  admin=false;
  showAdmin();
 }
});

start();
</script>
</body>
</html>
