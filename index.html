<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMONG US CREW ATTENDANCE</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:18px;color:#fff;
 font-family:Arial,sans-serif;
 background:radial-gradient(circle at top,#243b62,#080d19 70%);
 min-height:100vh
}
.container{max-width:600px;margin:auto}
header{text-align:center;padding:15px}
h1{color:#ff4655;font-size:25px}
header p{color:#a9badc}
.panel{
 background:#17243c;border:1px solid #405477;
 border-radius:15px;padding:17px;margin:15px 0;
 box-shadow:0 7px 22px #0007
}
h2{color:#ff6470;font-size:19px}
h3{color:#c8d8f5}
input,select,button{
 width:100%;padding:12px;margin:6px 0;
 border:1px solid #647a9e;border-radius:8px;
 font-size:15px
}
button{background:#e94352;color:white;border:0;font-weight:bold}
button.secondary{background:#405477}
button.danger{background:#7e3441}
button:disabled{opacity:.5}
.hidden{display:none!important}
.item{
 background:#263958;padding:12px;margin:9px 0;
 border-radius:9px;overflow-wrap:anywhere
}
.actions{display:flex;gap:8px}
.actions button{flex:1}
.stat{
 display:flex;justify-content:space-between;
 padding:8px 0;border-bottom:1px solid #405477
}
.rank{font-size:20px;color:#ffd66b}
#message{color:#ffd66b;text-align:center;min-height:25px}
.small{font-size:12px;color:#a9badc}
</style>
</head>
<body>
<div class="container">

<header>
<h1>🚀 AMONG US</h1>
<p>CREW ATTENDANCE SYSTEM</p>
</header>

<div class="panel">
<h2>🧑‍🚀 CREW CHECK-IN</h2>
<select id="member">
<option value="">メンバーを読み込み中...</option>
</select>
<button id="apply">出席を申請する</button>
</div>

<div class="panel">
<h2>🔐 ADMIN LOGIN</h2>
<input id="email" type="email" placeholder="管理者メールアドレス">
<input id="password" type="password" placeholder="パスワード">
<button id="login">ログイン</button>
<button id="logout" class="secondary hidden">ログアウト</button>
<p id="adminStatus">ログインしていません</p>
</div>

<div id="adminPanel" class="hidden">

<div class="panel">
<h2>📋 出席申請管理</h2>
<button id="refresh" class="secondary">申請一覧を更新</button>
<div id="requests">読み込み待ち</div>
</div>

<div class="panel">
<h2>👥 メンバー管理</h2>
<input id="newMember" placeholder="新しいメンバー名">
<button id="addMember">メンバーを追加</button>
<div id="membersAdmin"></div>
</div>

<div class="panel">
<h2>🏆 出席率ランキング</h2>
<p class="small">休日・テスト期間を除いた日数で計算</p>
<div id="ranking">集計中...</div>
</div>

<div class="panel">
<h2>⚙️ 集計開始日の設定</h2>
<p class="small">この日から出席率の集計を開始します。</p>
<input type="date" id="rankingStart">
<button id="saveRankingStart">集計開始日を保存</button>
</div>

<div class="panel">
<h2>📅 休日管理</h2>
<label>休日の日付</label>
<input type="date" id="holidayDate">
<input id="holidayName" placeholder="休日の名前（任意）">
<button id="addHoliday">休日を登録</button>
<div id="holidays"></div>
</div>

<div class="panel">
<h2>📝 テスト期間管理</h2>
<label>開始日</label>
<input type="date" id="testStart">
<label>終了日</label>
<input type="date" id="testEnd">
<input id="testName" placeholder="テスト期間の名前">
<button id="addTest">テスト期間を登録</button>
<div id="tests"></div>
</div>

</div>

<p id="message"></p>
</div>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

import {
 getAuth,signInAnonymously,signInWithEmailAndPassword,
 signOut,onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

import {
 getFirestore,collection,getDocs,addDoc,serverTimestamp,
 doc,updateDoc,deleteDoc,query,orderBy,getDoc,setDoc
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyDNzOhy5a5Q9xvX_khXCrQIgkgFBn9TyvE",
 authDomain:"amongus-crew-attendance.firebaseapp.com",
 projectId:"amongus-crew-attendance",
 storageBucket:"amongus-crew-attendance.firebasestorage.app",
 messagingSenderId:"560094086894",
 appId:"1:560094086894:web:683d51d9b3648054d5d5ff",
 measurementId:"G-W3HF87PBPX"
};

const ADMIN_UID="nPCMPMkbHyetAGOd0SS9GZKRZRo2";
const DEFAULT_START_DATE="2026-11-27";

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const $=id=>document.getElementById(id);

let admin=false;
let memberCache=[];
let requestCache=[];
let holidayCache=[];
let testCache=[];
let rankingStartDate=DEFAULT_START_DATE;

function msg(t){$("message").textContent=t}

function today(){
 const d=new Date();
 return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function dateText(timestamp){
 if(!timestamp)return "日付不明";
 return timestamp.toDate().toLocaleDateString("ja-JP");
}

async function loadMembers(){
 const snap=await getDocs(collection(db,"members"));
 memberCache=[];
 const select=$("member");
 select.innerHTML='<option value="">メンバーを選択</option>';

 snap.forEach(d=>{
  const x={id:d.id,...d.data()};
  memberCache.push(x);
  const o=document.createElement("option");
  o.value=d.id;
  o.textContent=x.name;
  select.appendChild(o);
 });

 if(admin)renderMembers();
}

async function loadRankingStart(){
 const ref=doc(db,"settings","attendance");
 const snap=await getDoc(ref);

 rankingStartDate=snap.exists()
  ? snap.data().startDate||DEFAULT_START_DATE
  : DEFAULT_START_DATE;

 $("rankingStart").value=rankingStartDate;
}

async function start(){
 try{
  if(!auth.currentUser){
   await signInAnonymously(auth);
  }
  await loadMembers();
 }catch(e){
  msg("接続エラー："+e.message);
 }
}

$("apply").onclick=async()=>{
 const id=$("member").value;
 const name=$("member").selectedOptions[0]?.textContent;

 if(!id){
  msg("メンバーを選択してください");
  return;
 }

 $("apply").disabled=true;
 msg("お待ちください...");

 try{
  await addDoc(collection(db,"attendance_requests"),{
   memberId:id,
   name,
   uid:auth.currentUser.uid,
   status:"pending",
   attendanceDate:today(),
   createdAt:serverTimestamp()
  });
  msg("申請できました！");
 }catch(e){
  msg("申請できません："+e.message);
 }finally{
  $("apply").disabled=false;
 }
};

$("login").onclick=async()=>{
 try{
  const result=await signInWithEmailAndPassword(
   auth,$("email").value,$("password").value
  );

  if(result.user.uid!==ADMIN_UID){
   await signOut(auth);
   msg("管理者アカウントではありません");
   return;
  }

  admin=true;
  showAdmin();
  await refreshAll();
  msg("管理者ログイン成功！");
 }catch(e){
  msg("ログイン失敗："+e.message);
 }
};

function showAdmin(){
 $("adminPanel").classList.toggle("hidden",!admin);
 $("logout").classList.toggle("hidden",!admin);
 $("login").classList.toggle("hidden",admin);
 $("email").classList.toggle("hidden",admin);
 $("password").classList.toggle("hidden",admin);
 $("adminStatus").textContent=
  admin?"管理者ログイン中":"ログインしていません";
}

$("logout").onclick=async()=>{
 await signOut(auth);
 admin=false;
 showAdmin();
 msg("ログアウトしました");
};

$("refresh").onclick=refreshAll;

async function loadRequests(){
 const area=$("requests");
 area.textContent="読み込み中...";

 const snap=await getDocs(query(
  collection(db,"attendance_requests"),
  orderBy("createdAt","desc")
 ));

 requestCache=[];
 snap.forEach(d=>requestCache.push({id:d.id,...d.data()}));

 area.innerHTML="";

 if(!requestCache.length){
  area.textContent="申請はありません";
  return;
 }

 requestCache.forEach(x=>{
  const item=document.createElement("div");
  item.className="item";

  const title=document.createElement("strong");
  title.textContent=x.name||"名前不明";

  const info=document.createElement("p");
  info.textContent="状態："+(x.status||"不明")+
   " / 日付："+(x.attendanceDate||dateText(x.createdAt));

  item.append(title,info);

  if(x.status==="pending"){
   const actions=document.createElement("div");
   actions.className="actions";

   const a=document.createElement("button");
   a.textContent="承認";
   a.onclick=()=>changeStatus(x.id,"approved");

   const r=document.createElement("button");
   r.textContent="却下";
   r.className="secondary";
   r.onclick=()=>changeStatus(x.id,"rejected");

   actions.append(a,r);
   item.append(actions);
  }

  area.append(item);
 });
}

async function changeStatus(id,status){
 try{
  await updateDoc(doc(db,"attendance_requests",id),{status});
  msg(status==="approved"?"承認しました":"却下しました");
  await refreshAll();
 }catch(e){
  msg("更新できません："+e.message);
 }
}

async function renderMembers(){
 const area=$("membersAdmin");
 area.innerHTML="";

 memberCache.forEach(x=>{
  const item=document.createElement("div");
  item.className="item";

  const name=document.createElement("span");
  name.textContent=x.name;

  const del=document.createElement("button");
  del.className="danger";
  del.textContent="削除";

  del.onclick=async()=>{
   if(!confirm(x.name+"を削除しますか？"))return;

   try{
    await deleteDoc(doc(db,"members",x.id));
    msg("メンバーを削除しました");
    await refreshAll();
   }catch(e){
    msg("削除できません："+e.message);
   }
  };

  item.append(name,del);
  area.append(item);
 });
}

$("addMember").onclick=async()=>{
 const name=$("newMember").value.trim();

 if(!name){
  msg("名前を入力してください");
  return;
 }

 try{
  await addDoc(collection(db,"members"),{name});
  $("newMember").value="";
  msg("メンバーを追加しました");
  await refreshAll();
 }catch(e){
  msg("追加できません："+e.message);
 }
};

async function loadHolidays(){
 const snap=await getDocs(collection(db,"holidays"));
 holidayCache=[];
 snap.forEach(d=>holidayCache.push({id:d.id,...d.data()}));

 const area=$("holidays");
 area.innerHTML="";

 holidayCache.sort((a,b)=>(a.date||"").localeCompare(b.date||""));

 holidayCache.forEach(x=>{
  const item=document.createElement("div");
  item.className="item";

  const text=document.createElement("span");
  text.textContent=(x.date||"日付不明")+" "+(x.name||"休日");

  const del=document.createElement("button");
  del.className="danger";
  del.textContent="削除";
  del.onclick=()=>removeRecord("holidays",x.id);

  item.append(text,del);
  area.append(item);
 });
}

$("addHoliday").onclick=async()=>{
 const date=$("holidayDate").value;

 if(!date){
  msg("日付を選択してください");
  return;
 }

 try{
  await addDoc(collection(db,"holidays"),{
   date,
   name:$("holidayName").value.trim()||"休日",
   createdAt:serverTimestamp()
  });

  $("holidayName").value="";
  msg("休日を登録しました");
  await refreshAll();
 }catch(e){
  msg("休日を登録できません："+e.message);
 }
};

async function loadTests(){
 const snap=await getDocs(collection(db,"test_periods"));
 testCache=[];
 snap.forEach(d=>testCache.push({id:d.id,...d.data()}));

 const area=$("tests");
 area.innerHTML="";

 testCache.forEach(x=>{
  const item=document.createElement("div");
  item.className="item";

  const text=document.createElement("span");
  text.textContent=(x.name||"テスト期間")+"："+x.start+" ～ "+x.end;

  const del=document.createElement("button");
  del.className="danger";
  del.textContent="削除";
  del.onclick=()=>removeRecord("test_periods",x.id);

  item.append(text,del);
  area.append(item);
 });
}

$("addTest").onclick=async()=>{
 const start=$("testStart").value;
 const end=$("testEnd").value;

 if(!start||!end||start>end){
  msg("開始日と終了日を正しく選んでください");
  return;
 }

 try{
  await addDoc(collection(db,"test_periods"),{
   start,
   end,
   name:$("testName").value.trim()||"テスト期間",
   createdAt:serverTimestamp()
  });

  $("testName").value="";
  msg("テスト期間を登録しました");
  await refreshAll();
 }catch(e){
  msg("テスト期間を登録できません："+e.message);
 }
};

async function removeRecord(col,id){
 try{
  await deleteDoc(doc(db,col,id));
  msg("削除しました");
  await refreshAll();
 }catch(e){
  msg("削除できません："+e.message);
 }
}

$("saveRankingStart").onclick=async()=>{
 const date=$("rankingStart").value;

 if(!date){
  msg("集計開始日を選択してください");
  return;
 }

 if(date>today()){
  msg("未来の日付は設定できません");
  return;
 }

 try{
  await setDoc(doc(db,"settings","attendance"),{
   startDate:date
  });
  rankingStartDate=date;
  calculateRanking();
  msg("集計開始日を保存しました！");
 }catch(e){
  msg("保存できません："+e.message);
 }
};

function isExcluded(date){
 if(holidayCache.some(x=>x.date===date))return true;

 return testCache.some(x=>
  date>=x.start&&date<=x.end
 );
}

function calculateRanking(){
 const area=$("ranking");
 area.innerHTML="";

 const eligible=[];
 const dates=[];

 const begin=new Date(rankingStartDate+"T12:00:00");
 const end=new Date(today()+"T12:00:00");

 if(begin>end){
  area.textContent="集計開始日を確認してください";
  return;
 }

 for(let d=new Date(begin);d<=end;d.setDate(d.getDate()+1)){
  const key=d.getFullYear()+"-"+
   String(d.getMonth()+1).padStart(2,"0")+"-"+
   String(d.getDate()).padStart(2,"0");

  if(!isExcluded(key))dates.push(key);
 }

 memberCache.forEach(m=>{
  const approved=new Set(
   requestCache
    .filter(r=>r.memberId===m.id&&r.status==="approved")
    .map(r=>r.attendanceDate||"")
    .filter(Boolean)
  );

  const count=[...approved].filter(d=>dates.includes(d)).length;
  const rate=dates.length?count/dates.length*100:0;

  eligible.push({name:m.name,count,rate});
 });

 eligible.sort((a,b)=>b.rate-a.rate||b.count-a.count);

 const summary=document.createElement("div");
 summary.className="stat";
 summary.textContent="集計対象日数："+dates.length+"日";
 area.append(summary);

 eligible.forEach((x,i)=>{
  const item=document.createElement("div");
  item.className="item";

  const title=document.createElement("strong");
  title.textContent=(i+1)+"位 "+x.name;

  const detail=document.createElement("p");
  detail.textContent=x.count+"日出席 / 出席率 "+x.rate.toFixed(1)+"%";

  item.append(title,detail);
  area.append(item);
 });
}

async function refreshAll(){
 if(!admin)return;

 try{
  await Promise.all([
   loadMembers(),
   loadRequests(),
   loadHolidays(),
   loadTests(),
   loadRankingStart()
  ]);

  calculateRanking();
 }catch(e){
  msg("データ取得エラー："+e.message);
 }
}

onAuthStateChanged(auth,user=>{
 if(user&&user.uid===ADMIN_UID){
  admin=true;
  showAdmin();
  refreshAll().catch(e=>msg(e.message));
 }else if(admin){
  admin=false;
  showAdmin();
 }
});

start();
</script>
</body>
</html>
